version: "2"
type: frontend
tech_stack:
  - php
  - vanilla-js
  - html/css
  - mysql
routes:
  - path: /librarian/index.php
    file: librarian/index.php
    auth_required: true
    description: Librarian Dashboard
  - path: /librarian/catalog.php
    file: librarian/catalog.php
    auth_required: true
    description: Manage Books Catalog
  - path: /librarian/catalog-add.php
    file: librarian/catalog-add.php
    auth_required: true
    description: Add New Book
  - path: /librarian/catalog-edit.php
    file: librarian/catalog-edit.php
    auth_required: true
    description: Edit Book Details
  - path: /librarian/checkin.php
    file: librarian/checkin.php
    auth_required: true
    description: Process Book Returns
  - path: /librarian/checkout.php
    file: librarian/checkout.php
    auth_required: true
    description: Process Book Loans
  - path: /librarian/pay-fine.php
    file: librarian/pay-fine.php
    auth_required: true
    description: Process Fine Payments
  - path: /librarian/records.php
    file: librarian/records.php
    auth_required: true
    description: View Loan Records
  - path: /librarian/reservations.php
    file: librarian/reservations.php
    auth_required: true
    description: View Reservations
features:
  - name: Librarian Dashboard
    description: View system overview and quick links
    files:
      - librarian/index.php
    entry_route: /librarian/index.php
    user_interactions:
      - Navigate to various management sections
    api_calls: []
    auth_required: true
  - name: Manage Catalog
    description: View, add, edit, and delete books
    files:
      - librarian/catalog.php
      - librarian/catalog-add.php
      - librarian/catalog-edit.php
      - librarian/catalog-delete.php
    entry_route: /librarian/catalog.php
    user_interactions:
      - View list of books
      - Search and filter catalog
      - Click add book to create a new book
      - Click edit to modify an existing book
      - Click delete to remove a book
    api_calls: []
    auth_required: true
  - name: Process Checkout
    description: Loan books to borrowers
    files:
      - librarian/checkout.php
    entry_route: /librarian/checkout.php
    user_interactions:
      - Enter borrower ID
      - Enter book copy ID
      - Submit to create loan
    api_calls: []
    auth_required: true
  - name: Process Checkin
    description: Return borrowed books
    files:
      - librarian/checkin.php
    entry_route: /librarian/checkin.php
    user_interactions:
      - Enter book copy ID
      - Submit to process return
    api_calls: []
    auth_required: true
  - name: Manage Reservations
    description: Approve or reject reservations
    files:
      - librarian/reservations.php
    entry_route: /librarian/reservations.php
    user_interactions:
      - View pending reservations
      - Approve reservation
      - Reject reservation
    api_calls: []
    auth_required: true
known_limitations: []
