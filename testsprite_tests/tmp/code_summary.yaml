version: "2"
type: frontend
tech_stack:
  - php
  - vanilla-js
  - html/css
  - mysql
routes:
  - path: /admin/index.php
    file: admin/index.php
    auth_required: true
    description: Admin Dashboard
  - path: /admin/users.php
    file: admin/users.php
    auth_required: true
    description: Manage Users
  - path: /admin/settings.php
    file: admin/settings.php
    auth_required: true
    description: System Settings
  - path: /admin/audit-log.php
    file: admin/audit-log.php
    auth_required: true
    description: View Audit Logs
  - path: /login.php
    file: login.php
    auth_required: false
    description: Login Page
features:
  - name: Admin Dashboard
    description: Main admin dashboard overview
    files:
      - admin/index.php
    entry_route: /admin/index.php
    user_interactions:
      - View stats
    api_calls: []
    auth_required: true
  - name: Manage Users
    description: Add, update, delete system users
    files:
      - admin/users.php
    entry_route: /admin/users.php
    user_interactions:
      - Fill create user form
      - Submit create user
      - View users list
      - Click edit user
      - Click delete user
    api_calls: []
    auth_required: true
  - name: System Settings
    description: Update global system settings
    files:
      - admin/settings.php
    entry_route: /admin/settings.php
    user_interactions:
      - Change setting values
      - Save settings
    api_calls: []
    auth_required: true
known_limitations: []
